<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>AICG3D 服装图库｜1407 套服装参考</title>
<meta name="description" content="AICG3D PoseSwap 内置服装图库：1407 套服装参考图，支持按分类筛选、关键词搜索，选择后回传 ComfyUI 换装节点。">
<style>
:root{
  --bg:#f5f7fb;--surface:#fff;--surface-2:#f8f9fc;--text:#171a21;--text-2:#5d6472;
  --text-3:#8a919f;--line:#e5e8ef;--line-strong:#d6dbe5;--accent:#5b5bd6;
  --accent-dark:#4747b8;--accent-soft:#eeeeff;--success:#137a52;--shadow:0 14px 40px rgba(28,35,60,.09);
  --radius:16px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
button{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(91,91,214,.28);outline-offset:2px}
.shell{width:min(1560px,calc(100% - 64px));margin-inline:auto}
.site-header{position:relative;background:var(--surface);border-bottom:1px solid var(--line)}
.site-header::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(700px 260px at 78% 0,rgba(91,91,214,.09),transparent 70%)}
.topbar,.hero{position:relative}
.topbar{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid rgba(229,232,239,.75)}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none}
.brand-mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#7373e8,#4d4dc2);box-shadow:0 6px 16px rgba(91,91,214,.22)}
.brand-copy{display:flex;flex-direction:column;line-height:1.2}
.brand-copy strong{font-size:15px;letter-spacing:.02em}
.brand-copy span{font-size:10px;color:var(--text-3);letter-spacing:.16em;text-transform:uppercase;margin-top:4px}
.online-link{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 15px;border:1px solid var(--line-strong);border-radius:11px;background:var(--surface);color:var(--text-2);text-decoration:none;font-size:12px;font-weight:700;transition:border-color .16s,color .16s,box-shadow .16s;flex:0 0 auto}
.online-link:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 4px 14px rgba(91,91,214,.12)}
.hero{display:flex;align-items:center;justify-content:space-between;gap:40px;padding:28px 0 26px}
.eyebrow{margin:0 0 8px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.hero h1{margin:0;font-size:clamp(26px,3vw,36px);line-height:1.2;letter-spacing:-.035em;font-weight:800}
.hero h1 .hero-tagline{display:block;margin-top:7px;color:var(--text-2);font-size:14px;font-weight:500;letter-spacing:0;line-height:1.4}
.hero-desc{max-width:740px;margin:12px 0 0;color:var(--text-2);font-size:14px;line-height:1.8;text-wrap:pretty}
.hero-stats{display:flex;align-items:center;flex:0 0 auto}
.stat{min-width:104px;padding:4px 26px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat strong{display:block;font-size:27px;line-height:1.2;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:6px;font-size:12px;color:var(--text-3)}
.controls{position:sticky;top:0;z-index:30;background:rgba(245,247,251,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.controls-inner{padding:14px 0 12px}
.line-tabs{display:flex;gap:8px;overflow-x:auto;padding:1px 1px 4px;scrollbar-width:none}
.line-tabs::-webkit-scrollbar{display:none}
.line-tab{flex:0 0 auto;min-height:48px;padding:7px 17px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;transition:border-color .16s,background .16s,color .16s}
.line-tab:hover{border-color:#b9bfe0}
.line-tab[aria-selected="true"]{background:var(--text);border-color:var(--text);color:#fff}
.tab-name{display:block;font-size:13px;font-weight:700;white-space:nowrap}
.tab-count{display:block;margin-top:1px;font-size:10px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.line-tab[aria-selected="true"] .tab-count{color:#b9bdc9}
.search-row{display:flex;gap:10px;margin-top:10px}
.search-box{position:relative;flex:1;display:flex;align-items:center}
.search-box>svg{position:absolute;left:15px;color:var(--text-3);pointer-events:none}
.search-box input{width:100%;height:46px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);padding:0 76px 0 43px;color:var(--text);font-size:14px;outline:none;transition:border-color .16s,box-shadow .16s}
.search-box input::placeholder{color:#9ba2af}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,91,214,.10)}
.search-clear{position:absolute;right:42px;width:28px;height:28px;border:0;border-radius:50%;background:var(--surface-2);color:var(--text-2);cursor:pointer;display:grid;place-items:center}
.search-clear:hover{background:var(--line)}
.search-key{position:absolute;right:13px;color:var(--text-3);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;line-height:20px}
main{padding:22px 0 54px}
.result-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:15px;min-height:30px}
.result-summary{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.result-summary strong{font-size:15px;font-variant-numeric:tabular-nums}
.result-summary span{font-size:12px;color:var(--text-3)}
.result-hint{color:var(--text-3);font-size:12px;display:flex;align-items:center;gap:6px}
.active-filters{display:flex;gap:7px;flex-wrap:wrap;margin:-3px 0 15px}
.filter-chip{height:28px;padding:0 9px;border:1px solid #dcdcf5;border-radius:8px;background:var(--accent-soft);color:var(--accent-dark);display:inline-flex;align-items:center;gap:6px;font-size:11px;cursor:pointer}
.filter-chip::after{content:"×";font-size:15px;line-height:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.garment-card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;outline:none}
.garment-card:hover,.garment-card:focus-visible{transform:translateY(-3px);border-color:#ccd1e3;box-shadow:var(--shadow)}
.card-image{position:relative;aspect-ratio:3/4;overflow:hidden;background:#f8f9fb}
.main-image{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.garment-card:hover .main-image{transform:scale(1.018)}
.image-top{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.garment-no,.cat-tag{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:7px;background:rgba(23,26,33,.76);backdrop-filter:blur(6px);color:#fff;font-size:10px;font-weight:700;letter-spacing:.04em}
.cat-tag{background:rgba(255,255,255,.90);color:var(--text);border:1px solid rgba(229,232,239,.8)}
.card-body{padding:13px 14px 11px}
.card-body h3{margin:0;font-size:13px;line-height:1.5;font-weight:700;min-height:40px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-id{display:block;margin-top:6px;color:var(--text-3);font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.load-more{display:flex;align-items:center;justify-content:center;gap:8px;min-width:220px;height:46px;margin:28px auto 0;padding:0 22px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);color:var(--text);font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(28,35,60,.03)}
.load-more:hover{border-color:var(--accent);color:var(--accent)}
.empty{grid-column:1/-1;padding:80px 20px;text-align:center;background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius)}
.empty h3{margin:0 0 6px;font-size:17px}
.empty p{margin:0 0 18px;color:var(--text-2)}
.empty button{height:40px;padding:0 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
.skeleton{pointer-events:none}
.skeleton .card-image,.skeleton-line{background:linear-gradient(90deg,#edf0f5 25%,#f7f8fb 50%,#edf0f5 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
.skeleton-line{height:12px;margin:14px;border-radius:6px}
.skeleton-line.short{width:55%;margin-top:0}
@keyframes shimmer{to{background-position:-200% 0}}
@media(max-width:1180px){.shell{width:min(1560px,calc(100% - 40px))}.hero-stats .stat{min-width:86px;padding-inline:18px}}
@media(max-width:860px){.hero{gap:20px}.stat{min-width:76px!important;padding-inline:14px!important}.stat strong{font-size:23px}}
@media(max-width:680px){
  .shell{width:calc(100% - 24px)}
  .topbar{min-height:58px}
  .brand-mark{width:32px;height:32px;border-radius:9px}
  .brand-copy strong{font-size:13px}
  .hero{display:block;padding:22px 0 20px}
  .hero h1{font-size:26px}
  .hero-desc{margin-top:9px;font-size:12px;line-height:1.75}
  .hero-stats{margin-top:20px;padding-top:15px;border-top:1px solid var(--line);justify-content:space-between}
  .hero-stats .stat{flex:1;min-width:0!important;padding:0 14px!important;text-align:center}
  .stat strong{font-size:21px}
  .controls-inner{padding:10px 0}
  .line-tabs{gap:6px}
  .line-tab{min-height:44px;padding:5px 12px;border-radius:10px}
  .search-row{margin-top:8px}
  .search-box input{height:44px;padding-left:39px;padding-right:40px;font-size:13px}
  .search-key{display:none}
  .search-clear{right:8px}
  .result-summary strong{font-size:13px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .garment-card{border-radius:12px}
  .image-top{inset:7px 7px auto}
  .garment-no,.cat-tag{min-height:21px;padding:0 6px;font-size:9px;border-radius:6px}
  .card-body{padding:10px 10px 8px}
  .card-body h3{font-size:11px;line-height:1.5;min-height:34px}
  .card-id{font-size:8px;margin-top:4px}
  .load-more{width:100%;margin-top:20px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="site-header">
  <div class="shell topbar">
    <span class="brand">
      <span class="brand-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="18" cy="7" r="2"/></svg></span>
      <span class="brand-copy"><strong>AICG3D 服装图库</strong><span>Garment Library</span></span>
    </span>
    <a class="online-link" href="https://paipiange.github.io/nvzhuang/" target="_blank" rel="noopener noreferrer" aria-label="访问在线服装图库 nvzhuang">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
      <span>在线服装图库 · nvzhuang</span>
    </a>
  </div>
  <div class="shell hero">
    <div>
      <p class="eyebrow">VIRTUAL TRY-ON · GARMENT LIBRARY</p>
      <h1>换装服装库<span class="hero-tagline">选择一套服装，随换姿一起换上</span></h1>
      <p class="hero-desc">内置 1407 套服装参考图。点击卡片后「使用此服装」即回传服装 ID 到 ComfyUI 换装节点；也可先预览大图确认细节。</p>
    </div>
    <div class="hero-stats" aria-label="图库统计">
      <div class="stat"><strong id="statTotal">1,407</strong><span>套服装</span></div>
      <div class="stat"><strong>8</strong><span>个分类</span></div>
    </div>
  </div>
</header>

<section class="controls" aria-label="图库筛选">
  <div class="shell controls-inner">
    <div class="line-tabs" id="lineTabs" role="tablist" aria-label="服装分类"></div>
    <div class="search-row">
      <label class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m20 20-4.2-4.2"/></svg>
        <input id="searchInput" type="search" placeholder="搜索服装描述、ID 或分类（英文关键词）" autocomplete="off" aria-label="搜索服装">
        <button class="search-clear" id="searchClear" type="button" aria-label="清空搜索" hidden><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        <span class="search-key" aria-hidden="true">/</span>
      </label>
    </div>
  </div>
</section>

<main class="shell">
  <h2 class="sr-only" style="position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">服装图库列表</h2>
  <div class="result-head">
    <div class="result-summary"><strong id="resultCount">正在加载图库…</strong><span id="visibleCount"></span></div>
    <div class="result-hint">点击卡片查看大图 · 在详情页点击「使用此服装」回传 ComfyUI</div>
  </div>
  <div class="active-filters" id="activeFilters" aria-label="当前筛选条件"></div>
  <div class="grid" id="grid" aria-live="polite">
    <div class="garment-card skeleton"><div class="card-image"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
    <div class="garment-card skeleton"><div class="card-image"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
    <div class="garment-card skeleton"><div class="card-image"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
    <div class="garment-card skeleton"><div class="card-image"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
  </div>
  <button class="load-more" id="loadMore" type="button" hidden>加载更多</button>
</main>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle" hidden style="position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:28px;background:rgba(15,18,28,.76);backdrop-filter:blur(8px)">
  <section style="position:relative;width:min(900px,100%);max-height:92dvh;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 28px 90px rgba(0,0,0,.35)">
    <button id="viewerClose" type="button" aria-label="关闭大图" style="position:absolute;right:14px;top:14px;z-index:4;width:42px;height:42px;border:1px solid #e5e8ef;border-radius:12px;background:rgba(255,255,255,.94);color:#171a21;cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    <div style="background:#eef0f4;display:grid;place-items:center;min-height:380px;max-height:60dvh;overflow:hidden">
      <img id="viewerImage" alt="" style="max-width:100%;max-height:60dvh;object-fit:contain">
    </div>
    <div style="padding:20px 24px 22px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <div>
          <div id="viewerEyebrow" style="color:#5b5bd6;font-size:11px;font-weight:800;letter-spacing:.1em"></div>
          <h2 id="viewerTitle" style="margin:6px 0 4px;font-size:18px;line-height:1.45"></h2>
          <code id="viewerId" style="color:#8a919f;font:10px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace"></code>
        </div>
        <button id="useGarment" type="button" style="min-height:44px;padding:0 20px;border:1px solid #5b5bd6;border-radius:11px;background:#5b5bd6;color:#fff;font-size:13px;font-weight:800;cursor:pointer">使用此服装 → ComfyUI</button>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
'use strict';
const PAGE_SIZE = 96;
const state = { cat: '', query: '', shown: PAGE_SIZE };
const $ = selector => document.querySelector(selector);
const grid = $('#grid');
const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const format = value => Number(value).toLocaleString('zh-CN');

let DATA = [];
let CATS = [];
let currentList = [];
let renderedCount = 0;
const viewerState = { index: 0, item: null, returnFocus: null };

function prepareData(data) {
  DATA = data.records.map(row => ({ ...row, '图': '/aicg3d_pose/garments/assets/' + row.id + '.webp' }));
  CATS = data.cats_cn || [];
  DATA.forEach(item => { item._search = `${item.desc} ${item.id} ${item.cat} ${item.cat_cn}`.toLowerCase(); });
  $('#statTotal').textContent = format(DATA.length);
  renderTabs();
  render();
}

function renderTabs() {
  const tabs = [['', '全部', DATA.length], ...CATS.map((cat, i) => [cat, cat, DATA.filter(item => item.cat_cn === cat).length])];
  $('#lineTabs').innerHTML = tabs.map(([value, label, count]) => `<button class="line-tab" type="button" role="tab" data-cat="${esc(value)}" aria-selected="${state.cat === value}"><span class="tab-name">${esc(label)}</span><span class="tab-count">${format(count)} 套</span></button>`).join('');
}

function hit(item) {
  return (!state.cat || item.cat_cn === state.cat) && (!state.query || item._search.includes(state.query));
}

function computeList() { return DATA.filter(hit); }

function card(entry, index) {
  return `<article class="garment-card" tabindex="0" data-index="${index}" aria-label="${esc(entry.desc)}">` +
    `<div class="card-image"><img class="main-image" src="${esc(entry.图)}" alt="${esc(entry.desc)}" loading="lazy" decoding="async">` +
    `<div class="image-top"><span class="garment-no">${esc(entry.id)}</span><span class="cat-tag">${esc(entry.cat_cn)}</span></div></div>` +
    `<div class="card-body"><h3>${esc(entry.desc)}</h3><code class="card-id">${esc(entry.id)}</code></div></article>`;
}

function render(append = false) {
  if (!append) { currentList = computeList(); renderedCount = 0; grid.innerHTML = ''; }
  const total = currentList.length;
  const visible = currentList.slice(renderedCount, state.shown);
  grid.insertAdjacentHTML('beforeend', visible.map((entry, offset) => card(entry, renderedCount + offset)).join(''));
  renderedCount += visible.length;
  $('#resultCount').textContent = `${format(total)} 套服装`;
  $('#visibleCount').textContent = total > state.shown ? `已显示 ${format(renderedCount)} / ${format(total)} 套` : '';
  if (!total) {
    grid.innerHTML = `<div class="empty"><h3>没有找到匹配的服装</h3><p>试试更换关键词或减少筛选条件。</p><button type="button" id="emptyReset">清除全部筛选</button></div>`;
  }
  const more = $('#loadMore');
  more.hidden = renderedCount >= total || !total;
  more.textContent = `加载更多（剩余 ${format(total - renderedCount)} 套）`;
  renderActiveFilters();
}

function renderActiveFilters() {
  const filters = [];
  if (state.cat) filters.push(['cat', `分类：${state.cat}`]);
  if (state.query) filters.push(['query', `搜索：${state.query}`]);
  $('#activeFilters').innerHTML = filters.map(([key, label]) => `<button class="filter-chip" type="button" data-clear="${key}">${esc(label)}</button>`).join('');
}

function resetAll() {
  state.cat = '';
  state.query = '';
  $('#searchInput').value = '';
  renderTabs();
  state.shown = PAGE_SIZE;
  render();
}

$('#lineTabs').addEventListener('click', event => {
  const button = event.target.closest('.line-tab');
  if (!button || button.dataset.cat === state.cat) return;
  state.cat = button.dataset.cat;
  state.shown = PAGE_SIZE;
  render();
});

let searchTimer;
$('#searchInput').addEventListener('input', event => {
  $('#searchClear').hidden = !event.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.query = event.target.value.trim().toLowerCase(); state.shown = PAGE_SIZE; render(); }, 120);
});

$('#searchClear').addEventListener('click', () => { $('#searchInput').value = ''; state.query = ''; render(); $('#searchInput').focus(); });
$('#activeFilters').addEventListener('click', event => {
  const button = event.target.closest('button[data-clear]');
  if (!button) return;
  if (button.dataset.clear === 'cat') state.cat = '';
  if (button.dataset.clear === 'query') { state.query = ''; $('#searchInput').value = ''; }
  renderTabs();
  state.shown = PAGE_SIZE;
  render();
});
$('#loadMore').addEventListener('click', () => { state.shown = Math.min(state.shown + PAGE_SIZE, currentList.length); render(true); });
grid.addEventListener('click', event => {
  if (event.target.closest('#emptyReset')) { resetAll(); return; }
  const card = event.target.closest('.garment-card[data-index]');
  if (!card) return;
  viewerState.index = Number(card.dataset.index);
  viewerState.item = currentList[viewerState.index];
  viewerState.returnFocus = document.activeElement;
  $('#viewer').hidden = false;
  document.body.style.overflow = 'hidden';
  showViewer();
});
grid.addEventListener('keydown', event => {
  if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('.garment-card[data-index]')) {
    event.preventDefault();
    viewerState.index = Number(event.target.dataset.index);
    viewerState.item = currentList[viewerState.index];
    $('#viewer').hidden = false;
    document.body.style.overflow = 'hidden';
    showViewer();
  }
});

function closeViewer() {
  if ($('#viewer').hidden) return;
  $('#viewer').hidden = true;
  document.body.style.overflow = '';
  if (viewerState.returnFocus && document.contains(viewerState.returnFocus)) viewerState.returnFocus.focus({ preventScroll: true });
}

function showViewer() {
  const item = viewerState.item;
  $('#viewerImage').src = item.图;
  $('#viewerEyebrow').textContent = `${viewerState.index + 1} / ${currentList.length} · ${item.cat_cn}`;
  $('#viewerTitle').textContent = item.desc;
  $('#viewerId').textContent = item.id;
}
$('#viewerClose').addEventListener('click', closeViewer);
$('#viewer').addEventListener('click', event => { if (event.target === $('#viewer')) closeViewer(); });
document.addEventListener('keydown', event => {
  if (!$('#viewer').hidden && event.key === 'Escape') closeViewer();
  if (event.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
    event.preventDefault();
    $('#searchInput').focus();
  }
});

// AICG3D garment bridge. Selection only, never queues or alters other nodes.
$('#useGarment').addEventListener('click', () => {
  if (!viewerState.item) return;
  const id = viewerState.item.id;
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'aicg3d-garment-select', id }, location.origin);
  } else {
    $('#useGarment').textContent = '当前服装 ID：' + id + '（请从 ComfyUI 节点打开以应用）';
  }
});
window.addEventListener('message', event => {
  if (event.origin !== location.origin || event.source !== window.parent || event.data?.type !== 'aicg3d-garment-current') return;
  const current = DATA.find(item => item.id === event.data.id);
  if (current) $('#useGarment').title = '当前节点：' + current.id;
});
window.parent.postMessage({ type: 'aicg3d-garment-ready' }, location.origin);

fetch('/aicg3d_pose/garments/catalog')
  .then(response => { if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.json(); })
  .then(prepareData)
  .catch(error => {
    console.error(error);
    $('#resultCount').textContent = '图库加载失败';
    grid.innerHTML = '<div class="empty"><h3>无法读取服装数据</h3><p>请确认通过 HTTP 服务访问页面（http://127.0.0.1:8188/aicg3d_pose/garments/gallery），并检查插件目录 garments/data/garment.json 是否存在。也可直接访问在线服装图库：<a href="https://paipiange.github.io/nvzhuang/" target="_blank" rel="noopener noreferrer">paipiange.github.io/nvzhuang</a></p><button type="button" onclick="location.reload()">重新加载</button></div>';
  });
})();
</script>
</body>
</html>
